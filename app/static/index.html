<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт техники — ПК, ноутбуки, мониторы</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2733; --muted:#6b7686; --line:#e5e9f0;
  --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --red:#dc2626;
  --chip:#eef2f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
.hidden{display:none !important}

/* layout */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--brand)}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:8px;font-weight:600}
.tab:hover{background:var(--chip);color:var(--ink)}
.tab.active{background:var(--brand);color:#fff}
.tab-dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:6px;min-width:190px;z-index:40;display:none}
.tab-dd.open .dd-menu{display:block}
.dd-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 12px;border-radius:7px;font-weight:600;cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--chip)}
.wrap{max-width:1180px;margin:0 auto;padding:20px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--chip);color:var(--muted)}
.stat .ic svg{width:22px;height:22px;display:block}
.stat .n{font-size:24px;font-weight:700;line-height:1.05}
.stat .l{color:var(--muted);font-size:12px;margin-top:3px}
.stat.brand .ic{background:#e8effe;color:var(--brand)}
.stat.ok .ic{background:#e9f9ef;color:var(--ok)}
.stat.warn .ic{background:#fef6e7;color:var(--warn)}
.stat.red .ic{background:#fdecec;color:var(--red)} .stat.red .n{color:var(--red)}
.parkbar{height:14px;border-radius:999px;background:var(--chip);overflow:hidden;display:flex}
.parkbar>span{height:100%}
.park-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink)}
.park-legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px;flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search{min-width:220px;width:auto;flex:1}
.sel{width:auto}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--chip);color:var(--ink)}
.btn.danger{color:var(--red)} .btn.danger:hover{background:#fef2f2}

/* table */
.tbl-scroll{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card);white-space:nowrap}
tbody tr:hover{background:#fafbfd}
td .sub{color:var(--muted);font-size:12px}
.row-actions{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-stock{color:#475569;background:#f1f5f9}
.b-issued{color:#15803d;background:#ecfdf3}
.b-repair{color:#b45309;background:#fffbeb}
.b-writeoff{color:#b91c1c;background:#fef2f2}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:600}

.empty{padding:40px;text-align:center;color:var(--muted)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 10px;border-radius:8px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(2,6,23,.3);animation:pop .12s ease}
@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 14px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
/* field labels */
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.checklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.checkitem{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.checkitem:last-child{border-bottom:0}
.checkitem input{width:auto}
.checkitem .meta{flex:1}
.checkitem .meta .sub{color:var(--muted);font-size:12px}

@media (max-width:620px){ .grid2{grid-template-columns:1fr} .wrap{padding:12px} .hide-sm{display:none} }

/* print act */
.print-area{background:#fff}
.print-area[hidden]{display:none}
@media screen{
  .print-area{position:fixed;inset:0;z-index:100;overflow:auto;padding:28px}
  .print-toolbar{position:sticky;top:-28px;margin:-28px -28px 20px;padding:12px 20px;background:#111827;color:#fff;display:flex;gap:10px;align-items:center}
  .print-toolbar .sp{flex:1;font-weight:600}
  .sheet{max-width:820px;margin:0 auto;padding:46px 54px;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
}
.sheet{color:#111;font-size:13.5px}
.sheet h1{font-size:17px;text-align:center;margin:0 0 4px}
.sheet .sub2{text-align:center;color:#444;margin-bottom:20px;font-size:12.5px}
.sheet.akt .akt-head{font-size:11.5px;line-height:1.35;margin-bottom:16px}
.sheet.akt .akt-title{text-align:center;font-weight:700;font-size:15px;line-height:1.4;margin:6px 0 10px}
.sheet.akt .akt-tbl tfoot td{border:1px solid #999;padding:6px 8px}
.sheet.akt .sign{margin-top:26px;flex-direction:column;gap:16px}
.sheet.akt .sign .cap{font-size:12.5px;color:#111}
.sheet .line-row{display:flex;justify-content:space-between;margin:14px 0}
.sheet p{margin:9px 0;text-align:justify}
.sheet table{font-size:12.5px;margin:14px 0}
.sheet th,.sheet td{border:1px solid #999;padding:6px 8px}
.sheet th{background:#f3f4f6;text-transform:none;letter-spacing:0;font-size:12px;position:static;color:#111}
.sign{display:flex;justify-content:space-between;gap:40px;margin-top:40px}
.sign .col{flex:1}
.sign .ln{border-bottom:1px solid #111;height:26px;margin-bottom:4px}
.sign .cap{font-size:11.5px;color:#444}
@media print{
  body{background:#fff}
  body>*{display:none !important}
  .print-area{display:block !important;position:static;padding:0}
  .print-area[hidden]{display:none !important}
  .print-toolbar{display:none !important}
  .sheet{border:0;box-shadow:none;max-width:none;margin:0;padding:0}
  @page{margin:16mm}
}

.userbox{display:flex;align-items:center;gap:8px}
.userbox .uname{font-weight:600;color:var(--muted);font-size:13px}
.login-ov{position:fixed;inset:0;background:linear-gradient(160deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.login-ov[hidden]{display:none}
.login-card{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.4);width:100%;max-width:360px;padding:30px 28px}
.login-card h1{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:9px}
.login-card h1 .dot{width:12px;height:12px;border-radius:4px;background:var(--brand)}
.login-card p{color:var(--muted);margin:0 0 18px;font-size:13px}
.login-card .field{margin-bottom:14px}
.login-err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span>Учёт техники <span id="appver" style="font-weight:400;color:var(--muted);font-size:11px"></span></div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="dash">Обзор</button>
    <div class="tab-dd">
      <button class="tab dd-toggle" type="button">Справочники ▾</button>
      <div class="dd-menu">
        <button class="dd-item" data-view="equip">Техника</button>
        <button class="dd-item" data-view="people">Сотрудники</button>
        <button class="dd-item" data-view="sup">Поставщики</button>
        <button class="dd-item" data-view="tsd">ТСД</button>
        <button class="dd-item" data-view="prn">Принтеры</button>
        <button class="dd-item" data-view="notif">Уведомления</button>
        <button class="dd-item" data-view="loc">Локации</button>
      </div>
    </div>
    <button class="tab" data-view="acts">Акты</button>
    <button class="tab" data-view="cart">Картриджи</button>
    <div class="tab-dd">
      <button class="tab dd-toggle" type="button">Настройки ▾</button>
      <div class="dd-menu">
        <button class="dd-item" data-view="req">Реквизиты для актов</button>
        <button class="dd-item" data-view="notifset">Уведомления (транспорт)</button>
        <button class="dd-item" data-view="backup">Данные и резервные копии</button>
        <button class="dd-item" data-view="users">Пользователи</button>
      </div>
    </div>
    <button class="tab" data-view="about">О программе</button>
  </nav>
  <div class="userbox" id="userbox"></div>
</div>
<div class="wrap" id="app"></div>

<div class="login-ov" id="loginOverlay" hidden>
  <form class="login-card" id="lg-form">
    <h1><span class="dot"></span>Учёт техники</h1>
    <div id="lg-step1">
      <p>Войдите, чтобы продолжить</p>
      <div class="field"><label>Логин</label><input id="lg-user" autocomplete="username"></div>
      <div class="field"><label>Пароль</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
    </div>
    <div id="lg-step2" class="hidden">
      <p>Введите код из приложения-аутентификатора (или резервный код)</p>
      <div class="field"><label>Код</label><input id="lg-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
    </div>
    <div class="login-err" id="lg-err"></div>
    <button class="btn primary" type="submit" style="width:100%" id="lg-submit">Войти</button>
  </form>
</div>
<div id="modalRoot"></div>
<div id="printArea" class="print-area" hidden></div>

<script>
/* ===== constants ===== */
const TYPES=['ПК','Ноутбук','Монитор','Телефон','Планшет','Аксессуар','Прочее'];
const STATUS={stock:'На складе',issued:'Выдано',repair:'В ремонте',writeoff:'Списано'};
const STATUS_CLS={stock:'b-stock',issued:'b-issued',repair:'b-repair',writeoff:'b-writeoff'};
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

/* ===== state ===== */
let DB={org:{},user:{},employees:[],equipment:[],acts:[]};
let view='dash';
let fEquip={q:'',type:'',status:''};
let fPeople='';

/* ===== utils ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empById=id=>DB.employees.find(e=>e.id===id);
const eqById=id=>DB.equipment.find(e=>e.id===id);
function holderLabel(eq){if(eq.empId){const e=empById(eq.empId);return e?e.fullName:eq.empId;}if(eq.assignType==='workplace'&&eq.workplace)return 'РМ: '+eq.workplace;return eq.holderText||'';}
const supById=id=>(DB.suppliers||[]).find(s=>s.id===id);
function _norm(s){return (s==null?'':String(s)).toLowerCase().replace(/ё/g,'е');}
// потокенный поиск: все слова запроса должны встречаться (в любом порядке), ё=е
function matchQuery(hay,q){const terms=_norm(q).split(/\s+/).filter(Boolean);if(!terms.length)return true;const h=_norm(hay);return terms.every(t=>h.includes(t));}
function filteredEquip(){
  let list=DB.equipment.slice();
  if(fEquip.type)list=list.filter(e=>e.type===fEquip.type);
  if(fEquip.status)list=list.filter(e=>e.status===fEquip.status);
  if(fEquip.q)list=list.filter(e=>matchQuery([e.name,e.innerName,e.invno,e.serial,holderLabel(e),e.workplace,e.location,(supById(e.supplierId)||{}).name].join(' '),fEquip.q));
  return list.sort((a,b)=>(a.type+a.name).localeCompare(b.type+b.name,'ru'));
}
// варианты <option> сотрудников с учётом поиска — для выбора в модалках
function empOptionsHTML(selectedId,q){
  let list=DB.employees.slice().sort((a,b)=>a.fullName.localeCompare(b.fullName,'ru'));
  if(q)list=list.filter(p=>matchQuery([p.fullName,p.login,p.email].join(' '),q));
  return '<option value="">— выберите —</option>'+list.map(p=>`<option value="${p.id}" ${selectedId===p.id?'selected':''}>${esc(p.fullName)}${p.login?' ('+esc(p.login)+')':''}</option>`).join('');
}
// варианты <option> поставщиков с учётом поиска
function supOptionsHTML(selectedId,q){
  let list=(DB.suppliers||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  if(q)list=list.filter(s=>matchQuery([s.name,s.contact,s.phone,s.email].join(' '),q));
  return '<option value="">— не указан —</option>'+list.map(s=>`<option value="${s.id}" ${selectedId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
}
function devCount(empId){return DB.equipment.filter(e=>e.empId===empId).length;}
function fmtDate(d){const x=d?new Date(d):new Date();return ('0'+x.getDate()).slice(-2)+'.'+('0'+(x.getMonth()+1)).slice(-2)+'.'+x.getFullYear();}

/* ===== API ===== */
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},
    body:body!==undefined?JSON.stringify(body):undefined,credentials:'same-origin'});
  if(r.status===401){showLogin();throw new Error('unauth');}
  if(!r.ok){let msg='';try{msg=(await r.json()).detail;}catch(e){}throw new Error(msg||('Ошибка '+r.status));}
  const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();
}
const TAB_PERM={dash:null,about:null,req:'admin',notifset:'admin',backup:'admin',users:'admin',equip:'equip',people:'people',acts:'acts',cart:'cart',prn:'cart',notif:'cart',sup:'sup',tsd:'tsd',loc:'equip'};
function applyTabs(){
  const u=DB.user||{},admin=u.isAdmin,perms=u.perms||[];
  const can=need=>!need?true:(need==='admin'?!!admin:(!!admin||perms.includes(need)));
  document.querySelectorAll('.tab[data-view]').forEach(t=>t.classList.toggle('hidden',!can(TAB_PERM[t.dataset.view])));
  document.querySelectorAll('.tab-dd').forEach(dd=>{
    let any=false;
    dd.querySelectorAll('.dd-item').forEach(it=>{const show=can(TAB_PERM[it.dataset.view]);it.classList.toggle('hidden',!show);if(show)any=true;});
    dd.classList.toggle('hidden',!any);
  });
  const need=TAB_PERM[view];
  if(need&&!can(need))view='dash';
}
async function reload(){DB=await api('GET','/api/state');paintUser();applyTabs();render();}

/* ===== auth ===== */
let loginStep=1;
function resetLogin(){loginStep=1;const s1=$('#lg-step1'),s2=$('#lg-step2'),sb=$('#lg-submit'),cd=$('#lg-code');if(s1)s1.classList.remove('hidden');if(s2)s2.classList.add('hidden');if(sb)sb.textContent='Войти';if(cd)cd.value='';}
function showLogin(){resetLogin();$('#loginOverlay').hidden=false;setTimeout(()=>{const u=$('#lg-user');if(u)u.focus();},50);}
function hideLogin(){$('#loginOverlay').hidden=true;}
function paintUser(){
  const ver=$('#appver');if(ver&&DB.version)ver.textContent='v'+DB.version;
  const el=$('#userbox');if(!el)return;
  const nm=(DB.user&&(DB.user.fullName||DB.user.username))||'';
  el.innerHTML=`<button class="btn sm ghost" id="u-profile" title="Профиль">${esc(nm)}${DB.user&&DB.user.twofa?' 🔒':''}</button>
    <button class="btn sm ghost" id="u-logout">Выход</button>`;
  $('#u-profile').onclick=profileModal;
  $('#u-logout').onclick=async()=>{await api('POST','/api/logout');location.reload();};
}
async function doLogin(){
  const err=$('#lg-err');err.textContent='';
  try{
    if(loginStep===2){
      await api('POST','/api/login/2fa',{code:$('#lg-code').value.trim()});
      resetLogin();hideLogin();await reload();return;
    }
    const r=await api('POST','/api/login',{username:$('#lg-user').value.trim(),password:$('#lg-pass').value});
    if(r&&r.need2fa){loginStep=2;$('#lg-step1').classList.add('hidden');$('#lg-step2').classList.remove('hidden');$('#lg-submit').textContent='Подтвердить';setTimeout(()=>{const el=$('#lg-code');if(el)el.focus();},50);return;}
    resetLogin();hideLogin();await reload();
  }catch(e){err.textContent=(loginStep===2)?'Неверный код':'Неверный логин или пароль';}
}
async function boot(){
  try{await api('GET','/api/me');hideLogin();await reload();}
  catch(e){showLogin();}
}


/* ===== DASH ===== */
const ICONS={
  laptop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 0 1-5.1 4.9L5 16.8 7.2 19l4.9-4.9A4 4 0 0 0 17 9l-2 2-2-2z"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6"/><path d="M18 20a5.8 5.8 0 0 0-3-5"/></svg>',

function statCard(cls,icon,n,label){return `<div class="stat ${cls}"><div class="ic">${ICONS[icon]||''}</div><div><div class="n">${n}</div><div class="l">${label}</div></div></div>`;}
function viewDash(){
  const q=DB.equipment||[];
  const total=q.length, issued=q.filter(e=>e.status==='issued').length,
        stock=q.filter(e=>e.status==='stock').length, repair=q.filter(e=>e.status==='repair').length,
        off=q.filter(e=>e.status==='writeoff').length;
  const low=(DB.cartridges||[]).filter(c=>c.low).length;
  const byType=TYPES.map(t=>[t,q.filter(e=>e.type===t).length]).filter(x=>x[1]);
  const seg=[['issued',issued,'#16a34a','Выдано'],['stock',stock,'#64748b','На складе'],['repair',repair,'#d97706','В ремонте'],['writeoff',off,'#dc2626','Списано']];
  const parkTotal=total||1;
  return `
  <p class="hint" style="margin:0 0 14px;font-size:14px">Всего на учёте <b style="color:var(--ink)">${total}</b> ед. техники${issued?` · выдано ${issued}`:''}${low?` · <span style="color:var(--red)">картриджей ниже минимума: ${low}</span>`:''}</p>
  <div class="stats">
    ${statCard('brand','laptop',total,'Единиц техники')}
    ${statCard('ok','check',issued,'Выдано сотрудникам')}
    ${statCard('','box',stock,'На складе')}
    ${statCard('warn','wrench',repair,'В ремонте')}
    ${statCard('','users',DB.employees.length,'Сотрудников')}
    ${statCard('','printer',(DB.printers||[]).length,'Принтеров')}
    ${statCard('','barcode',(DB.tsd||[]).length,'ТСД')}
    ${statCard('','drop',(DB.cartridges||[]).length,'Картриджей')}
    ${statCard('','doc',DB.acts.length,'Актов')}
    ${statCard(low?'red':'','drop',low,'Картриджей ниже минимума')}
  </div>
  ${total?`<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>Состояние парка</h2></div>
    <div class="modal-b">
      <div class="parkbar">${seg.filter(s=>s[1]).map(s=>`<span style="width:${(s[1]/parkTotal*100).toFixed(1)}%;background:${s[2]}"></span>`).join('')}</div>
      <div class="park-legend">${seg.map(s=>`<span><span class="dot" style="background:${s[2]}"></span>${s[3]}: <b>${s[1]}</b></span>`).join('')}</div>
    </div>
  </div>`:''}
  <div class="card">
    <div class="card-h"><h2>По типам оборудования</h2></div>
    <div class="tbl-scroll"><table><thead><tr><th>Тип</th><th>Всего</th><th>Выдано</th><th>На складе</th><th>В ремонте</th></tr></thead><tbody>
    ${(()=>{
      let rows=byType.map(([t])=>{
        const items=q.filter(e=>e.type===t);
        return `<tr><td><span class="tag">${esc(t)}</span></td><td>${items.length}</td>
          <td>${items.filter(e=>e.status==='issued').length}</td>
          <td>${items.filter(e=>e.status==='stock').length}</td>
          <td>${items.filter(e=>e.status==='repair').length}</td></tr>`;
      }).join('');
      const extra=(n,label)=>n?`<tr><td><span class="tag">${label}</span></td><td>${n}</td><td class="sub">—</td><td class="sub">—</td><td class="sub">—</td></tr>`:'';
      rows+=extra((DB.printers||[]).length,'Принтеры');
      rows+=extra((DB.tsd||[]).length,'ТСД');
      return rows||'<tr><td colspan="5" class="empty">Нет данных</td></tr>';
    })()}
    </tbody></table></div>
  </div>`;
}

function rowEquip(e){
  const holder=holderLabel(e);
  const wp=(e.assignType!=='workplace'&&e.workplace)?`<div class="sub">${esc(e.workplace)}</div>`:'';
  const noCost=!e.cost, needAct=(e.status==='issued'&&!e.hasAct);
  const priceCell=e.cost?esc(e.cost):'<span style="color:var(--red);font-weight:600">нет</span>';
  const actCell=e.hasAct
    ?`<span style="color:var(--ok);font-weight:600">${esc(e.actLabel)||'✓'}</span>`
    :(e.status==='issued'?'<span style="color:var(--red);font-weight:600">нет</span>':'<span class="sub">—</span>');
  return `<tr${(noCost||needAct)?' style="background:#fff6f3"':''}>
    <td><span class="tag">${esc(e.type)}</span></td>
    <td>${esc(e.name)}${e.innerName?`<div class="sub">${esc(e.innerName)}</div>`:''}${e.location?`<div class="sub">${esc(e.location)}</div>`:''}</td>
    <td class="mono">${esc(e.invno)||'—'}</td>
    <td class="mono hide-sm">${esc(e.serial)||'—'}</td>
    <td><span class="badge ${STATUS_CLS[e.status]}">${STATUS[e.status]}</span></td>
    <td>${priceCell}</td>
    <td>${actCell}</td>
    <td>${holder?esc(holder):'<span class="sub">—</span>'}${wp}</td>
    <td class="row-actions">
      <button class="btn sm ghost" data-act="label" data-id="${e.id}" title="Этикетка 15×50">🏷</button>
      ${e.status==='issued'
        ?`<button class="btn sm ghost" data-act="return" data-id="${e.id}">Вернуть</button>`
        :`<button class="btn sm" data-act="issue" data-id="${e.id}">Назначить</button>`}
      <button class="btn sm ghost" data-act="edit" data-id="${e.id}">✎</button>
      <button class="btn sm ghost danger" data-act="del" data-id="${e.id}">✕</button>
    </td>
  </tr>`;
}

function userModal(id){
  const x=id?(USERS||[]).find(u=>String(u.id)===String(id)):{username:'',fullName:'',role:'user',perms:[]};
  const SEC=[['equip','Техника'],['people','Сотрудники'],['acts','Акты'],['cart','Картриджи'],['sup','Поставщики'],['tsd','ТСД']];
  openModal(`<div class="modal-h"><h3>${id?'Пользователь':'Новый пользователь'}</h3></div>
    <div class="modal-b">
      <div class="grid2"><div class="field"><label>Логин</label><input id="u-login" value="${esc(x.username)}" ${id?'readonly':''}></div>
        <div class="field"><label>ФИО</label><input id="u-fio" value="${esc(x.fullName||'')}"></div></div>
      <div class="field"><label>${id?'Новый пароль (пусто — не менять)':'Пароль'}</label><input id="u-pass" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Роль</label><select id="u-role"><option value="user" ${x.role!=='admin'?'selected':''}>Пользователь</option><option value="admin" ${x.role==='admin'?'selected':''}>Администратор</option></select></div>
      <div class="field" id="u-perms-box"><label>Доступ к разделам</label>
        <div class="checklist" style="padding:8px">${SEC.map(([k,v])=>`<label class="checkitem" style="border:0;padding:4px 0"><input type="checkbox" value="${k}" ${(x.perms||[]).includes(k)?'checked':''}> <span>${v}</span></label>`).join('')}</div>
        <p class="hint">Администратору доступны все разделы и настройки — список игнорируется.</p>
      </div>
    </div>
    <div class="modal-f"><button class="btn ghost" id="m-cancel">Отмена</button><button class="btn primary" id="m-save">Сохранить</button></div>`);
  const syncRole=()=>{$('#u-perms-box').style.opacity=$('#u-role').value==='admin'?'.45':'1';};
  $('#u-role').onchange=syncRole;syncRole();
  $('#m-cancel').onclick=closeModal;
  $('#m-save').onclick=async()=>{
    const perms=[...document.querySelectorAll('#u-perms-box input:checked')].map(i=>i.value);
    const data={fullName:$('#u-fio').value.trim(),role:$('#u-role').value,perms};
    const pw=$('#u-pass').value.trim();if(pw)data.password=pw;
    try{
      if(id){await api('PUT','/api/users/'+id,data);}
      else{data.username=$('#u-login').value.trim();if(!data.username){toast('Укажите логин');return;}if(!pw){toast('Укажите пароль');return;}await api('POST','/api/users',data);}
      USERS=null;closeModal();render();
    }catch(e){errToast(e);}
  };
}

async function cartStock(id,delta){
  try{const r=await api('POST','/api/cartridges/'+id+'/stock',{delta});await reload();notifyToast(r.alerts);}catch(e){errToast(e);}
}
function notifyToast(alerts){
  if(!alerts||!alerts.length)return;
  const okCh=alerts.filter(x=>x.ok).map(x=>x.channel.replace('telegram','Telegram').replace('email','почта'));
  const bad=alerts.filter(x=>!x.ok);
  if(okCh.length)toast('⚠️ Низкий остаток — уведомление отправлено: '+okCh.join(', '));
  if(bad.length)toast('Ошибка уведомления: '+bad.map(x=>x.channel+' — '+x.info).join('; '));
}

/* ===== render ===== */
function render(){
  document.querySelectorAll('.tab[data-view]').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
  document.querySelectorAll('.tab-dd').forEach(dd=>{
    dd.classList.remove('open');
    const owns=[...dd.querySelectorAll('.dd-item')].some(it=>it.dataset.view===view);
    const tg=dd.querySelector('.dd-toggle');if(tg)tg.classList.toggle('active',owns);
  });
  const app=$('#app');
  if(view==='dash')app.innerHTML=viewDash();
  else if(view==='equip')app.innerHTML=viewEquip();
  else if(view==='people')app.innerHTML=viewPeople();
  else if(view==='acts')app.innerHTML=viewActs();
  else if(view==='cart')app.innerHTML=viewCartridges();
  else if(view==='prn')app.innerHTML=viewPrinters();
  else if(view==='notif')app.innerHTML=viewNotifications();

}

/* ===== modal infra ===== */
function openModal(html){const root=$('#modalRoot');root.innerHTML=`<div class="overlay" id="ov"><div class="modal">${html}</div></div>`;$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal();};}
function closeModal(){$('#modalRoot').innerHTML='';}
function toast(msg){const t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600';document.body.appendChild(t);setTimeout(()=>t.remove(),1900);}
function errToast(e){toast((e&&e.message&&e.message!=='unauth')?e.message:'Не удалось сохранить');}

      </div>

      </div>

    </div>
    <div class="modal-f"><button class="btn ghost" id="m-cancel">Отмена</button><button class="btn primary" id="m-save">Сохранить</button></div>`);
  $('#m-cancel').onclick=closeModal;
  $('#f-sup-q').oninput=()=>{const cur=$('#f-supplier').value;$('#f-supplier').innerHTML=supOptionsHTML(cur,$('#f-sup-q').value);};
  $('#m-save').onclick=async()=>{

async function delEquip(id){const e=eqById(id);if(confirm(`Удалить «${e.name}»?`)){try{await api('DELETE','/api/equipment/'+id);await reload();}catch(e){errToast(e);}}}

function assignModal(id){

      const res=await api('POST','/api/equipment/'+id+'/issue',body);

/* ===== labels (15×50 мм) ===== */
function printLabels(items){
  items=(items||[]).filter(Boolean);
  if(!items.length)return;
  const labels=items.map(e=>`
    <div class="lbl">
      <div class="nm">${esc(e.name)}</div>
      <img src="/api/equipment/${encodeURIComponent(e.id)}/barcode.svg" alt="">
      <div class="inv">Инв. № ${esc(e.invno||e.id)}</div>
    </div>`).join('');
  const html=`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Этикетки</title>
    <style>
      @page{size:50mm 15mm;margin:0}
      html,body{margin:0;padding:0}
      body{font-family:Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .lbl{width:50mm;height:15mm;box-sizing:border-box;padding:1mm 1.5mm;display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow:hidden;page-break-after:always;border:0}
      .lbl:last-child{page-break-after:auto}
      .lbl .nm{font-size:7.5pt;font-weight:700;line-height:1.05;max-width:47mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
      .lbl img{height:6mm;max-width:47mm;object-fit:contain;display:block}
      .lbl .inv{font-size:7pt;font-weight:700;line-height:1;letter-spacing:.3px;text-align:center;max-width:47mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      @media screen{body{background:#eef1f5;padding:16px;display:flex;flex-wrap:wrap;gap:8px}.lbl{background:#fff;border:1px solid #cbd3df;box-shadow:0 1px 2px rgba(0,0,0,.1)}}
    </style></head><body>${labels}
    <script>
      window.addEventListener('load',function(){
        var imgs=[].slice.call(document.images),left=imgs.length;
        function go(){try{window.focus();window.print();}catch(e){}}
        if(!left){setTimeout(go,100);return;}
        imgs.forEach(function(im){ if(im.complete){if(--left===0)setTimeout(go,150);}
          else{im.onload=im.onerror=function(){if(--left===0)setTimeout(go,150);};}});
      });
    <\/script></body></html>`;
  const w=window.open('','_blank');
  if(!w){toast('Разрешите всплывающие окна для печати этикеток');return;}
  w.document.open();w.document.write(html);w.document.close();
}

      contractNo:$('#p-cno').value.trim(),contractDate:$('#p-cdate').value.trim()};
    if(!data.fullName){toast('Укажите ФИО');return;}
    try{if(id)await api('PUT','/api/employees/'+id,data);else await api('POST','/api/employees',data);closeModal();await reload();}catch(e){errToast(e);}

}
async function delPerson(id){
  const n=devCount(id);
  if(n&&!confirm(`За сотрудником числится ${n} ед. техники — она будет возвращена на склад. Удалить сотрудника?`))return;
  if(!n&&!confirm('Удалить сотрудника?'))return;
  try{await api('DELETE','/api/employees/'+id);await reload();}catch(e){errToast(e);}
}

/* ===== 2FA ===== */
function twofaModal(){
  if(DB.user&&DB.user.twofa){
    openModal(`<div class="modal-h"><h3>Двухфакторная аутентификация</h3></div>
      <div class="modal-b">
        <p style="margin-top:0"><span class="badge b-issued">Включена</span></p>
        <p class="hint">Чтобы отключить 2FA, подтвердите паролем.</p>
        <div class="field"><label>Пароль</label><input type="password" id="tf-pass"></div>
      </div>
      <div class="modal-f"><button class="btn ghost" id="m-cancel">Закрыть</button><button class="btn danger" id="m-save">Отключить 2FA</button></div>`);
    $('#m-cancel').onclick=closeModal;
    $('#m-save').onclick=async()=>{try{await api('POST','/api/2fa/disable',{password:$('#tf-pass').value});closeModal();await reload();toast('2FA отключена');}catch(e){errToast(e);}};

async function twofaSetup(){
  let data;
  try{data=await api('POST','/api/2fa/setup');}catch(e){errToast(e);return;}
  openModal(`<div class="modal-h"><h3>Включить 2FA</h3></div>
    <div class="modal-b">
      <p class="hint" style="margin-top:0">Отсканируйте QR в приложении-аутентификаторе (Google Authenticator, Authy, 1Password и т.п.) или введите ключ вручную, затем введите код для подтверждения.</p>
      <div style="text-align:center;margin:10px 0"><img src="/api/2fa/qr.svg?t=${Date.now()}" alt="QR" style="width:188px;height:188px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:8px"></div>
      <div class="field"><label>Ключ (если QR не считывается)</label><input class="mono" value="${esc(data.secret)}" readonly onclick="this.select()"></div>
      <div class="field"><label>Код из приложения</label><input id="tf-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
    </div>
    <div class="modal-f"><button class="btn ghost" id="m-cancel">Отмена</button><button class="btn primary" id="m-save">Включить</button></div>`);
  $('#m-cancel').onclick=closeModal;
  $('#m-save').onclick=async()=>{
    try{const r=await api('POST','/api/2fa/enable',{code:$('#tf-code').value.trim()});closeModal();await reload();showRecoveryCodes(r.recovery_codes||[]);}
    catch(e){errToast(e);}
  };
}
function showRecoveryCodes(codes){
  openModal(`<div class="modal-h"><h3>2FA включена ✓</h3></div>

      <p class="hint" style="margin-top:0;color:var(--red);font-weight:600">Сохраните резервные коды. Каждый можно использовать один раз, если потеряете доступ к приложению. Повторно они не показываются.</p>

/* ===== print act (шаблон ИП — акт приёма-передачи материальных ценностей) ===== */
function actNumber(a){return a.no+'-'+((a.date||'').replace(/\./g,'/'));}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function costNum(s){const d=(s||'').toString().replace(/[^0-9]/g,'');return d?parseInt(d,10):0;}
function fmtMoney(n){return n.toLocaleString('ru-RU');}
function printAct(a){
  if(!a)return;
  const org=DB.org||{};
  const emp=empById(a.empId)||{fullName:a.empName||'',position:''};
  const isReturn=a.kind==='return';
  const items=a.items||[];
  const total=items.reduce((s,it)=>s+costNum(it.cost),0);
  const d=new Date();const day=('0'+d.getDate()).slice(-2),mon=MONTHS[d.getMonth()],yr=d.getFullYear();
  const blank=(v,w)=>{v=(v||'').toString().trim();return v?esc(v):'_'.repeat(w||12);};
  const empLine=`${esc(emp.fullName)}${emp.position?', '+esc(emp.position):''}`;
  const passBlock=`паспорт: ${blank(emp.passport)}, выдан: ${blank(emp.passportIssued)}, Код подразделения: ${blank(emp.passportCode,8)}`;
  const parties=isReturn
    ? `${esc(org.name||'')}, именуемый в дальнейшем «Работодатель», в лице предпринимателя ${esc(org.signatory||'')}, действующего на основании ${esc(org.basis||'')}, с одной стороны и ${empLine}, ${passBlock}, именуемый в дальнейшем «Работник», с другой стороны, совместно именуемые в дальнейшем «Стороны», составили настоящий Акт о нижеследующем:`
    : `${esc(org.name||'')}, именуемый в дальнейшем «Работодатель», в лице предпринимателя ${esc(org.signatory||'')}, действующего на основании ${esc(org.basis||'')}, с одной стороны и ${empLine}, ${passBlock}, именуемый в дальнейшем «Работник», с другой стороны, совместно именуемые в дальнейшем «Стороны», руководствуясь ст. 244 Трудового кодекса Российской Федерации, составили настоящий Акт о нижеследующем:`;
  const cd=emp.contractDate?('от '+esc(emp.contractDate)):'от «____» ______________ ______ г.';
  const clause1=isReturn
    ? `1. Работник возвратил, а Работодатель принял следующие материальные ценности:`
    : `1. В соответствии с Трудовым договором ${cd} № ${blank(emp.contractNo,6)} Работодатель передал, а Работник принял следующие материальные ценности для выполнения своих должностных обязанностей:`;
  const rows=items.map((it,i)=>`<tr>
      <td style="text-align:center">${i+1}.</td>
      <td>${esc(it.name)}${it.invno?` <span style="color:#555">(инв. № ${esc(it.invno)})</span>`:''}</td>
      <td>${esc(it.serial)||'—'}</td>
      <td style="text-align:center">шт.</td>
      <td style="text-align:center">1</td>
      <td style="text-align:right">${it.cost?esc(it.cost):'—'}</td>
    </tr>`).join('');
  const html=`
    <div class="print-toolbar">
      <span class="sp">Акт № ${esc(actNumber(a))}${isReturn?' (возврат)':''} — предпросмотр</span>
      <button class="btn" onclick="window.print()">🖨 Печать / PDF</button>
      <button class="btn" onclick="window.location='/api/acts/${a.id}/docx'">⬇ Word (.docx)</button>
      <button class="btn" onclick="document.getElementById('printArea').hidden=true">Закрыть</button>
    </div>
    <div class="sheet akt">
      <div class="akt-head">
        <div><b>${esc(org.name||'')}</b>${org.inn?`, ИНН ${esc(org.inn)}`:''}</div>
        ${org.address?`<div>${esc(org.address)}</div>`:''}
      </div>
      <div class="akt-title">
        <div>Акт № ${esc(actNumber(a))}</div>
        <div>приема-передачи</div>
        <div>материальных ценностей работнику${isReturn?' (возврат)':''}</div>
      </div>
      <div class="line-row"><span>г.&nbsp;${esc(org.city||'')}</span><span>«${day}» ${mon} ${yr} г.</span></div>
      <p>${parties}</p>
      <p>${clause1}</p>
      <table class="akt-tbl">
        <thead><tr>
          <th style="width:34px">N&nbsp;п/п</th><th>Наименование материальных ценностей</th>
          <th style="width:110px">Серийный номер</th><th style="width:66px">Ед. изм.</th>
          <th style="width:66px">Кол-во</th><th style="width:96px">Стоимость, руб.</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td colspan="5" style="text-align:right;font-weight:600">Итоговая стоимость переданных материальных ценностей:</td>
          <td style="text-align:right;font-weight:700">${total?fmtMoney(total):'—'}</td>
        </tr></tfoot>
      </table>
      <p>2. Материальные ценности проверены и просчитаны в присутствии Сторон. Замечания: (при наличии) – передано в новом состоянии.</p>
      <p>3. Настоящий Акт составлен в двух экземплярах, имеющих равную юридическую силу, по одному для каждой Стороны.</p>
      <p>4. Подписи Сторон:</p>
      <div class="sign">
        <div class="col"><div class="cap">Работодатель: ____________ / ${esc(org.signatoryShort||'')} <span style="color:#555">(Ф.И.О./подпись)</span></div></div>
        <div class="col"><div class="cap">Работник: ____________ / ${esc(emp.fullName||'__________')} <span style="color:#555">(Ф.И.О./подпись)</span></div></div>
      </div>
    </div>`;
  const pa=$('#printArea');pa.innerHTML=html;pa.hidden=false;pa.scrollTop=0;
}

/* ===== export/import ===== */
function download(name,content,type){const blob=new Blob([content],{type:type||'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){
  const head=['Тип','Наименование','Внутр. наименование','Инв.№','S/N','Статус','Сотрудник / место','Логин','E-mail','Рабочее место','Локация','Поставщик','Заказ / дата покупки','Стоимость','Примечание'];
  const rows=DB.equipment.map(e=>{const emp=e.empId?empById(e.empId):null;return [e.type,e.name,e.innerName||'',e.invno,e.serial,STATUS[e.status],holderLabel(e),emp?emp.login:'',emp?emp.email:'',e.workplace,e.location,(supById(e.supplierId)||{}).name||'',e.purchase,e.cost||'',e.note||''].map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';');});
  download('technika-'+fmtDate().replace(/\./g,'-')+'.csv','﻿'+head.join(';')+'\n'+rows.join('\n'),'text/csv');
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.equipment||!d.employees)throw 0;if(!confirm('Импорт полностью заменит текущие технику, сотрудников и акты. Продолжить?')){return;}await api('POST','/api/import',d);await reload();toast('Данные импортированы');}catch(e){toast('Не удалось импортировать файл');}};
  r.readAsText(f);ev.target.value='';
}

/* ===== init ===== */
document.getElementById('tabs').addEventListener('click',e=>{
  const tg=e.target.closest('.dd-toggle');
  if(tg){e.stopPropagation();const dd=tg.closest('.tab-dd');const willOpen=!dd.classList.contains('open');document.querySelectorAll('.tab-dd').forEach(x=>x.classList.remove('open'));if(willOpen)dd.classList.add('open');return;}
  const item=e.target.closest('.dd-item');
  if(item){if(item.dataset.view==='users')USERS=null;view=item.dataset.view;render();return;}
  const b=e.target.closest('.tab[data-view]');
  if(b){if(b.dataset.view==='users')USERS=null;view=b.dataset.view;render();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.tab-dd'))document.querySelectorAll('.tab-dd').forEach(x=>x.classList.remove('open'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();const pa=$('#printArea');if(pa)pa.hidden=true;}});
$('#lg-form').addEventListener('submit',e=>{e.preventDefault();doLogin();});
boot();

</script>
