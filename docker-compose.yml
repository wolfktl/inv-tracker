services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inv}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inv} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-inv}:${POSTGRES_PASSWORD:-inv}@db:5432/${POSTGRES_DB:-inventory}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SEED_DEMO: ${SEED_DEMO:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    restart: unless-stopped

volumes:
  pgdata:
